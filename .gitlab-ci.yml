image: docker.nexus.snrinternal.com/synerise/base-build-images:nodejs24

variables:
  APP: ds-docs
  NODE_OPTIONS: --max-old-space-size=4096
  GITOPS: 'true'
  MODULE: 'documentation'
  LIBRARY_PIPELINE: 'NO'
  APP_NAME_OVERRIDE: ds-docs
  NPM_REGISTRY: https://nexus.snrinternal.com/repository/npm-release/
  # Every job below runs only on `merge_request_event` or on the default branch, so without this
  # opt-in nothing is tested before merge. `core/gitlab_templates` (included at `ref: master`, so
  # its changes land here with no commit on our side) gates merge request pipelines behind this
  # flag in `pipeline/defaults.yml`:
  #
  #   - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $USE_MERGE_REQUEST_TESTS != "yes"
  #     when: never
  #
  # The gate exists because `workflow:rules` switches off the implicit `only: [branches, tags]` of
  # legacy `only:`/`except:` jobs, which gave some consumers a duplicate merge request pipeline.
  # This repo has none: every job here declares `rules:`, and the last merge request pipeline to
  # run under `workflow:rules` before the gate landed (1750711, !3955) built the same five jobs as
  # the ones before it, with nothing extra.
  USE_MERGE_REQUEST_TESTS: 'yes'

.install_pnpm: &install_pnpm
  - npm install -g pnpm@11.26.0
  # pnpm 11 reads pnpm_config_* rather than npm_config_*, and `pnpm config set`
  # now writes global YAML instead of .npmrc, where a relative store-dir has no
  # well-defined base. An absolute env var leaves nothing to interpret: get this
  # wrong and the store lands outside .pnpm-store, the cache is always empty and
  # every --offline job fails.
  - export pnpm_config_store_dir="$CI_PROJECT_DIR/.pnpm-store"
  # Since 11.21 pnpm verifies the lockfile against its supply-chain policies on
  # every install, and offline it reads registry metadata from the cache dir
  # rather than the package store. That default is ~/.cache/pnpm, outside the
  # project, so GitLab cannot cache it and every --offline job fails with
  # ERR_PNPM_NO_OFFLINE_META even with a fully warm .pnpm-store.
  - export pnpm_config_cache_dir="$CI_PROJECT_DIR/.pnpm-cache"
  # The nexus cert chain is why .npmrc.dist carries strict-ssl=false; v11 no
  # longer reads that from .npmrc. Kept here rather than in pnpm-workspace.yaml
  # so it stays a CI concern instead of a committed default every local install
  # would silently inherit.
  - export pnpm_config_strict_ssl=false
  - export SNR_NPM_TOKEN="$(echo -n $SNR_NPM_REGISTRY_USERNAME:$SNR_NPM_REGISTRY_PASSWORD | base64)"
  - cp .npmrc.dist .npmrc


default:
  cache:
    - key:
        files:
          - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
    - key: $CI_COMMIT_REF_SLUG
      paths:
        - .nx
      policy: pull-push

stages:
  - install
  - prepare
  - test
  - build
  - ai-review
  - deploy
  - k8s-deploy-stg
  - k8s-deploy-prod

include:
  - template: Code-Quality.gitlab-ci.yml
  - project: 'Core/gitlab_templates'
    ref: master
    file: '/ai_deploy_kapitan.yml'
  - project: 'core/gitlab_templates'
    ref: master
    file: '/pipeline/ai-review.yml'


install:
  stage: install
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install_pnpm]
    - cp .npmrc.dist .npmrc
    - echo "" >> .npmrc
    - export SNR_NPM_TOKEN="$(echo -n $SNR_NPM_REGISTRY_USERNAME:$SNR_NPM_REGISTRY_PASSWORD | base64)"
    - echo "//nexus.snrinternal.com/repository/npm-release/:_auth = $SNR_NPM_TOKEN" >> .npmrc
    - echo "email = $NPM_EMAIL" >> .npmrc
    - echo "always-auth = true" >> .npmrc
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint:ci
    - pnpm check:no-package-test-config
    - rm -f .npmrc
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: v11
    paths:
        - .pnpm-store
        - .pnpm-cache
    policy: pull-push

build_packages:
  stage: prepare
  needs: ['install']
  variables:
    KUBERNETES_CPU_REQUEST: 4
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 22Gi
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
    - key: $CI_COMMIT_REF_SLUG
      paths:
        - .nx
      policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install_pnpm]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm build
    - pnpm types
  artifacts:
    paths:
      - packages/components/*/dist
      - packages/components/flag/src/icons
      - packages/components/icon/src/icons
      - packages/components/avatar/src/defaultAvatars
    expire_in: 1h
    # when: on_success

circular_dependencies:
  stage: test
  needs: ['build_packages']
  variables:
    KUBERNETES_CPU_REQUEST: 4
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 22Gi
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - !reference [.install_pnpm]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm check:circular-dependencies


run_tests:
  stage: test
  needs: ['build_packages']
  variables:
    KUBERNETES_CPU_REQUEST: 4
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 22Gi
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
    - key: $CI_COMMIT_REF_SLUG
      paths:
        - .nx
      policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - !reference [.install_pnpm]
  script:
    - ls -l packages/components/core
    - pnpm install --frozen-lockfile --offline
    - ls -l packages/components/core
    - pnpm test:ci

chromatic_publish:
  stage: test
  needs: ['build_packages']
  variables:
    KUBERNETES_CPU_REQUEST: 4
    KUBERNETES_MEMORY_REQUEST: 16Gi
    KUBERNETES_MEMORY_LIMIT: 22Gi
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - !reference [.install_pnpm]
  script:
    - ls -l packages/components/core
    - pnpm install --frozen-lockfile --prefer-offline
    # - apt-get -qq update
    # - apt-get install -y jq
    - test ! -e packages/storybook/storybook-static && (cd packages/storybook; pnpm build-storybook --quiet --stats-json)
    - npx lerna run pack:ci --since origin/master
    - test -d packages/storybook/storybook-static/static && (cd packages/storybook/storybook-static/static; ls > index.txt) || true
    - (cd packages/storybook; npx chromatic --diagnostics-file --project-token=$CHROMATIC_PROJECT_TOKEN_SB7 --storybook-build-dir ./storybook-static/ --exit-zero-on-changes)
    # - CHROMATIC_SB_URL=$(jq -r '.storybookUrl' packages/storybook/chromatic-diagnostics.json)
    # - echo "CHROMATIC_SB_URL=$CHROMATIC_SB_URL" >> deploy.env
    # - test -f packages/storybook/storybook-static/static/index.txt && pnpm tgz-package-json --url $CHROMATIC_SB_URL --inputFilePath packages/storybook/storybook-static/static/index.txt --outputFilePath packages.json || true
  artifacts:
    # reports:
      # dotenv: deploy.env
    # expose_as: "package tgz versions json"
    paths:
      - packages.json
      - packages/storybook/chromatic-diagnostics.json
  # environment:
    # name: review/$CI_COMMIT_REF_SLUG
    # url: $CHROMATIC_SB_URL 
  interruptible: true

publish_packages:
  stage: build
  needs: ['build_packages']
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
  environment:
    name: npm
  variables:
    PUBLISH_TITLE: "build: publish"
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE == $PUBLISH_TITLE)
  before_script:
    - !reference [.install_pnpm]
  script:
    # Install against nexus, which is the only registry .pnpm-cache was warmed
    # for: pnpm's metadata cache is keyed by hostname, and since 11.21 an
    # --offline install verifies the lockfile against that metadata. Switching
    # the registry first would send it looking for registry.npmjs.org metadata
    # that no job ever populated, failing with ERR_PNPM_NO_OFFLINE_META.
    - pnpm install --frozen-lockfile --offline
    - echo "Tag version $CI_COMMIT_TAG"
    - echo "Commit ref $CI_COMMIT_REF_NAME"
    - echo "Commit title $CI_COMMIT_TITLE"
    - echo "Publisher $GITLAB_USER_EMAIL"
    # Publishing goes to npmjs, and lerna reads .npmrc with npm's own ini
    # semantics via libnpmpublish - it cannot read the global YAML that v11's
    # `pnpm config set` now writes, so the registry has to be stated here.
    - echo 'registry=https://registry.npmjs.org/' > .npmrc
    - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> .npmrc
    - echo "email = $GITLAB_USER_EMAIL" >> .npmrc
    - npx lerna publish from-package --no-git-tag-version --yes
    - rm -f .npmrc

# Best-effort: post a mechanical "packages published" card to the Teams releases channel as soon
# as a `build: publish` commit publishes, so the channel is always notified even if nobody runs the
# /ds-release skill. The richer two-audience changelog follows from /ds-release. Package list is
# parsed from the publish commit body (lerna writes one `@synerise/ds-x@version` line per pkg), so
# it needs no tags (CI publishes with --no-git-tag-version). No-ops if the webhook is unset.
notify_release:
  stage: deploy
  needs: ['publish_packages']
  allow_failure: true
  variables:
    PUBLISH_TITLE: "build: publish"
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE == $PUBLISH_TITLE)
  script:
    - |
      DATE=$(date +%d-%m-%Y)
      PKG_LINES=$(git log -1 --format=%b | grep -oE '@synerise/[^ ]+@[0-9][^ ]*' || true)
      COUNT=$(printf '%s\n' "$PKG_LINES" | sed '/^$/d' | wc -l | tr -d ' ')
      DS_VER=$(printf '%s\n' "$PKG_LINES" | grep -oE '@synerise/design-system@[0-9][^ ]*' | head -1)
      SECTION=$(printf '%s\n' "$PKG_LINES" | sed '/^$/d' | awk '{printf "- %s\\n", $0}')
      bash scripts/notify-teams.sh \
        --webhook-env TEAMS_RELEASES_WEBHOOK \
        --status Good \
        --title "🚀 Design System published — ${DATE}" \
        --text "${DS_VER} and ${COUNT} packages are published and available to install / upgrade from the registry." \
        --collapsible-section "📦 Show published versions (${COUNT})|${SECTION}" \
        --button "Pipeline=${CI_PIPELINE_URL}" \
        --button "Public Storybook=https://design.synerise.com/storybook-static/"

build_storybook:
  stage: build
  needs: ['build_packages']
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - !reference [.install_pnpm]
  script:
    - pnpm install --frozen-lockfile --offline
    - pnpm build-storybook
    - mv packages/storybook/storybook-static/ packages/docs-site/storybook-static
  artifacts:
    paths:
      - packages/docs-site
    expire_in: 1h
    when: on_success

deploy_storybook:
  image: docker.nexus.snrinternal.com/docker:stable
  stage: deploy
  needs: ['build_storybook']
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - SANITY_BRANCH=$CI_COMMIT_REF_SLUG
    - echo "Sanitized branch name ${SANITY_BRANCH}"
    - echo "${SNR_DOCKER_REGISTRY_PASSWORD}" | docker login "${SNR_DOCKER_REGISTRY_HOST}" --username "${SNR_DOCKER_REGISTRY_USERNAME}" --password-stdin
    - echo "${SNR_DOCKER_REGISTRY_PASSWORD}" | docker login "${SNR_DOCKER_REGISTRY_GLOBAL_HOST}" --username "${SNR_DOCKER_REGISTRY_USERNAME}" --password-stdin
    - cd packages/docs-site
    - pwd
    - docker build -t ds-docs .
    - echo "Push commit image"

    - docker tag ds-docs $SNR_DOCKER_REGISTRY_HOST/synerise/ds-docs:"$SANITY_BRANCH"-"${CI_COMMIT_SHA}"
    - docker push $SNR_DOCKER_REGISTRY_HOST/synerise/ds-docs:"$SANITY_BRANCH"-"${CI_COMMIT_SHA}"
    - echo "Image pushed to remote repository from branch ${CI_COMMIT_REF_NAME}"

    - docker tag ds-docs $SNR_DOCKER_REGISTRY_HOST/synerise/ds-docs:"$SANITY_BRANCH"-latest
    - docker push $SNR_DOCKER_REGISTRY_HOST/synerise/ds-docs:"$SANITY_BRANCH"-latest
    - echo "Image pushed to remote repository from branch ${CI_COMMIT_REF_NAME} for commit ${CI_COMMIT_SHA}"

k8s-prod-gitops:
  extends: .autodeploy-template
  stage: k8s-deploy-prod
  environment:
    name: prod
  when: manual
  only:
    refs:
      - master
    variables:
      - $LIBRARY_PIPELINE == "NO" && $GITOPS == "true"
  parallel:
    matrix:
      - ENV: g001-misc1
        AUTODEPLOY_TAG: $CI_COMMIT_REF_SLUG-$CI_COMMIT_SHA


chromatic_publish_baseline:
  stage: deploy
  needs: ['build_packages']
  cache:
    - key:
        files:
        - pnpm-lock.yaml
        prefix: v11
      paths:
        - .pnpm-store
        - .pnpm-cache
      policy: pull
  allow_failure: true
  variables:
    PUBLISH_TITLE: "build: publish"
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE == $PUBLISH_TITLE)
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - !reference [.install_pnpm]
  script:
    - pnpm install --frozen-lockfile --offline
    - (cd packages/storybook; pnpm chromatic --project-token=$CHROMATIC_PROJECT_TOKEN_SB7 --auto-accept-changes)
  interruptible: true
