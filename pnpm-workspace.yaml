packages:
  - packages/components/*
  - packages/tokens
  - packages/storybook

onlyBuiltDependencies:
  - '@swc/core'
  - core-js
  - esbuild
  - husky
  - nx
  - style-dictionary

linkWorkspacePackages: "deep"
preferWorkspacePackages: true
hoistWorkspacePackages: true
publicHoistPattern:
  - "*eslint*"
